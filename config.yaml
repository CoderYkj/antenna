data:
  source: akshare
  cache_dir: data/cache
  default_days: 365

universe:
  watchlist:
    - "600519"   # 贵州茅台
    - "000858"   # 五粮液
    - "601318"   # 中国平安
    - "000001"   # 平安银行
    - "600036"   # 招商银行
  scan_pool: all  # watchlist（自选）或 all（全 A 股，需先 fetch --all）

model:
  target_days: 5
  threshold: 0.02
  train_years: 3
  test_months: 3
  saved_dir: models/saved

reports:
  output_dir: reports/output
