# ────────────────────────────────────────────────────────────────────
# Antenna 配置模板 — 复制为 config.yaml 后填入真实凭据
#
#   cp config.example.yaml config.yaml
#
# config.yaml 已列入 .gitignore,真实凭据不会被跟踪。
# ────────────────────────────────────────────────────────────────────

data:
  source:       akshare
  cache_dir:    data/cache
  default_days: 365

universe:
  # 自选股代码(字符串,保留前导零):
  watchlist:
    - "600519"   # 贵州茅台
    - "000858"   # 五粮液
    - "601318"   # 中国平安
    - "000001"   # 平安银行
    - "600036"   # 招商银行
  # watchlist = 仅自选 / all = 全 A 股(需先跑 fetch --all)
  scan_pool: all

model:
  target_days:  5       # 预测未来 N 日涨跌
  threshold:    0.02    # 涨跌幅判定阈值(2%)
  train_years:  3       # 训练数据年限
  test_months:  3       # 回测窗口月数
  saved_dir:    models/saved

reports:
  output_dir:   reports/output

scan:
  workers:      8
  # 推荐重排打分参数（可选）
  recommend_scoring:
    w_prob:               0.62
    w_rank:               0.18
    w_momentum:           0.12
    w_resonance:          0.08
    w_tactic_precision:   0.40
    atr_ref:              0.06
    atr_penalty_scale:    0.70
    atr_penalty_cap:      0.10
    drawdown_ref:        -0.35
    drawdown_penalty_scale: 0.25
    drawdown_penalty_cap:   0.08
    momentum_divisor:     2.0
  # 推荐提精闸门（近期命中率走弱时，自动收紧低质量买入候选）
  recommend_precision_gate:
    enabled:              true
    min_samples_7d:       15
    min_samples_30d:      60
    weak_acc_7d:          0.54
    weak_acc_30d:         0.50
    hard_acc_30d:         0.42
    min_recommend_score_weak: 0.44
    min_rise_prob_weak:   0.57
    min_resonance_weak:   1
    min_recommend_score_hard: 0.48
    min_rise_prob_hard:   0.60
    min_resonance_hard:   2
    protect_top_buy_weak: 3
    protect_top_buy_hard: 2
    max_demote_ratio_weak: 0.50
    max_demote_ratio_hard: 0.65
    use_prob_bin_guard:   true
    prob_bin_min_samples: 12
    prob_bin_min_hit_rate_weak: 0.48
    prob_bin_min_hit_rate_hard: 0.52
    use_confidence_guard: true
    confidence_min_samples: 12
    confidence_min_hit_rate_weak:
      高: 0.52
      中: 0.48
      低: 0.44
    confidence_min_hit_rate_hard:
      高: 0.55
      中: 0.50
      低: 0.46
    use_tactic_guard:     true
    tactic_min_samples:   30
    tactic_min_precision_weak: 0.50
    tactic_min_precision_hard: 0.54
    use_symbol_memory_guard: true
    symbol_memory_window_days: 30
    symbol_memory_min_samples: 3
    symbol_memory_min_hit_rate_weak: 0.40
    symbol_memory_min_hit_rate_hard: 0.45
    use_payoff_guard:      true
    payoff_min_gain_weak:  2.0
    payoff_min_gain_hard:  2.5
    payoff_min_ratio_weak: 0.45
    payoff_min_ratio_hard: 0.60
    payoff_min_risk_pct:   6.0
    use_technical_guard:   true
    tech_min_confirmations_weak: 2
    tech_min_confirmations_hard: 3
    tech_min_available_checks: 3
    tech_rsi_floor_weak:    50
    tech_rsi_floor_hard:    53
    tech_vol_ratio_floor_weak: 1.0
    tech_vol_ratio_floor_hard: 1.1
    use_symbol_risk_guard:  true
    symbol_risk_window_days: 45
    symbol_risk_min_samples: 3
    symbol_risk_dd_threshold: -0.10
    symbol_risk_max_rate_weak: 0.55
    symbol_risk_max_rate_hard: 0.45
    use_liquidity_guard:   true
    liquidity_min_turnover_weak: 1.0
    liquidity_min_turnover_hard: 1.8
    liquidity_max_turnover_weak: 25.0
    liquidity_max_turnover_hard: 20.0
    liquidity_min_vol_ratio_weak: 0.9
    liquidity_min_vol_ratio_hard: 1.0
    use_trend_guard:       true
    trend_min_hits_weak:   2
    trend_min_hits_hard:   3
    trend_min_available_checks: 3
    trend_close_buffer_weak: -0.01
    trend_close_buffer_hard: 0.0
    use_extension_guard:   true
    max_close_ma20_dev_weak: 0.12
    max_close_ma20_dev_hard: 0.08
    use_volatility_guard:  true
    atr_pct_max_weak:      0.10
    atr_pct_max_hard:      0.07
    use_edge_guard:        true
    edge_min_prob_weak:    0.008
    edge_min_prob_hard:    0.015
    use_dual_target_guard: true
    dual_min_short_gain_weak: 1.5
    dual_min_short_gain_hard: 2.0
    dual_min_long_gain_weak: 2.2
    dual_min_long_gain_hard: 3.0
    dual_min_long_short_ratio_weak: 0.75
    dual_min_long_short_ratio_hard: 0.90
    use_atr_reward_guard:   true
    min_gain_atr_ratio_weak: 1.00
    min_gain_atr_ratio_hard: 1.25
    adaptive_tuning:
      enabled: true
      sample_target_7d: 20
      sample_target_30d: 90
      weak_soft_margin_7d: 0.02
      weak_soft_margin_30d: 0.02
      hard_strict_margin_30d: 0.05
      soft_min_factor: 0.90
      soft_max_factor: 1.10
      soft_count_delta: -1
      soft_demote_ratio_factor: 0.85
      strict_min_factor: 1.10
      strict_max_factor: 0.90
      strict_count_delta: 1
      strict_demote_ratio_factor: 1.10

# ── 飞书集成 ────────────────────────────────────────────────
feishu:
  # 单向 Webhook(自定义机器人,可选;为空则跳过定时推送)
  webhook_url:  ""
  scan_top:     20                    # 扫描结果推送 Top N

  # 双向交互机器人(自建应用,必填以启用 feishu_poll.py)
  app_id:       ""                    # cli_xxxxxxxxxxxxxx
  app_secret:   ""                    # 32 位长字符串
  chat_ids:                           # 机器人监控的会话(oc_ 为群聊)
    - ""                              # 例: oc_xxxxxxxxxxxxxxx

# ── AI 闲聊(两个 key 至少填一个) ─────────────────────────
anthropic:
  api_key:      ""                    # Anthropic API Key (sk-ant-xxx)
  model:        claude-haiku-4-5-20251001

deepseek:
  api_key:      ""
  model:        deepseek-chat

qwen:
  api_key:      ""                    # 阿里云 DashScope (sk-xxx)
  model:        qwen3-8b              # qwen3-8b / qwen3-14b / qwen3-235b-a22b

# ── 风格采集(可选;style 子命令用) ────────────────────────
colleague:
  p2p_chat_id:  ""                    # 与目标同事的 P2P 会话 ID
  open_id:      ""                    # 或用 open_id 替代 p2p_chat_id
  fetch_days:   60
  min_messages: 30

# ── PM2 监控面板 ──────────────────────────────────────────
pm2_monitor:
  host:         127.0.0.1
  port:         9615
  username:     admin
  password:     "CHANGE_ME"           # 建议改成强密码
  log_lines:    200

# ── P2 ai_reason LLM 深度推荐理由 ────────────────────────
# 可选;启用后 cmd_scan_bot 的 Top-N 每股调一次 LLM(缓存 24h;日封顶 50 次)
ai_reason:
  enable:       true                  # false 则 cmd_scan_bot 不调 LLM

# ── 多通道总开关 ──────────────────────────────────────────
channels:
  feishu:  true    # 飞书（默认开，保持现有行为）
  wecom:   false   # 企业微信（配置好凭据后改为 true）

# ── 企业微信自建应用 ───────────────────────────────────────
wecom:
  corp_id:          ""    # 我的企业 → 企业信息 → 企业ID
  agent_id:         0     # 自建应用 → AgentId（整数）
  secret:           ""    # 自建应用 → Secret
  # ↓ Phase 3 专属（双向对话，需公网 HTTPS）
  callback_token:   ""    # 接收消息 → Token
  encoding_aes_key: ""    # 接收消息 → EncodingAESKey（43位）
  callback_port:    5000
  callback_path:    /wecom/callback
  allowed_users:    []    # 指令白名单，空列表=不限制
